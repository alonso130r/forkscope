# Starter shape for connecting a user-owned environment and planner.
# Replace these adapter paths with importable factories from your project.
environment:
  factory: your_package.environment:create_environment

planner:
  factory: your_package.planner:create_planner

evaluation:
  seeds: [1, 2, 3, 4, 5]
  horizons: [1, 2, 4, 8, 16]
  max_steps: 500
  output_path: outputs/point_mass/results.jsonl
