[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "forkscope"
version = "0.1.0"
description = "A local workbench for evaluating test-time planning rollouts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Forkscope contributors" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.8",
  "typer>=0.12",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
jax = ["jax>=0.4.30"]
gymnasium = ["gymnasium>=1.0"]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
forkscope = "forkscope.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forkscope"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
